[package]
name = "khana"
version = "0.1.0"
edition = "2024"

[lib]
# (staticlib: the iPhone app links the core as libkhana.a; the Mac and Android builds use the rlib / their own ways)
crate-type = ["rlib", "staticlib"]

# Release builds (every download): no debug information, symbol names stripped (the JNI and C entry points the shells call stay
# exported). Panics still unwind: the FFI layer catches them (src/ffi). Debug assertions are off, so the web inspector is off too.
[profile.release]
debug = false
strip = "symbols"
debug-assertions = false
overflow-checks = false

[dependencies]
fancy-regex = "0.16"
hound = "3.5.1"
libc = "0.2.191"
ndarray = "0.16"
once_cell = "1.21.4"
ort = { version = "=2.0.0-rc.8", default-features = false, features = ["half", "load-dynamic", "ndarray"] }
ort-sys = { version = "=2.0.0-rc.8", default-features = false }
rand = "0.10.3"
rand_distr = "0.6.0"
realfft = "3.5.1"
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-general-category = "1.1.0"
unicode-normalization = "0.1.26"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

# the Mac window and its services (the Android app's window is its own Java shell: android/)
# (Vosk, the speech recognizer that checks the voice, is not in the iPhone and Windows apps)
[target.'cfg(not(any(target_os = "ios", target_os = "windows")))'.dependencies]
vosk = "0.3.1"

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21.2"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
tao = "0.37.2"
# (mac-proxy: WebKit's proxy setting, used to send any stray web traffic to a dead end: src/mac_main.rs; no extra crates)
wry = { version = "0.57.1", features = ["mac-proxy"] }

[build-dependencies]
cc = "1.10.0"

# the Windows window: the same tao / wry / muda as the Mac's, on Edge's web view (WebView2)
[target.'cfg(target_os = "windows")'.dependencies]
muda = "0.21.2"
tao = "0.37.2"
wry = "0.57.1"
