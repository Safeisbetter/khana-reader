[package]
name = "khana"
version = "0.1.0"
edition = "2024"

[dependencies]
fancy-regex = "0.16"
hound = "3.5.1"
libc = "0.2.191"
ndarray = "0.16"
once_cell = "1.21.4"
ort = { version = "=2.0.0-rc.8", default-features = false, features = ["half", "load-dynamic", "ndarray"] }
ort-sys = { version = "=2.0.0-rc.8", default-features = false }
rand = "0.10.3"
rand_distr = "0.6.0"
realfft = "3.5.1"
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-general-category = "1.1.0"
unicode-normalization = "0.1.26"
vosk = "0.3.1"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

# the Mac window and its services (the Android app's window is its own Java shell: android/)
[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21.2"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
tao = "0.37.2"
wry = "0.57.1"

[build-dependencies]
cc = "1.10.0"
