# The Windows app (experimental, not tried on a real PC). Built on GitHub's own Windows computers, in two editions:
#   light: no translator (about 0.5 GB); full: with the translator (CTranslate2, built here, and the 600M translation model; about 1.1 GB).
# Both hold the program, ONNX Runtime 1.19.2 (Microsoft's published build) beside it, the page (web/) and the models (taken from the Android
# downloads of the release, which hold the same files). A check of the core and of the window runs before a package is made.
# Run by hand (Actions -> Windows -> Run workflow) or on a push to the branch windows-full.
name: Windows

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Also publish the packages as the experimental release"
        type: boolean
        default: false
  push:
    branches: [windows-full]

# (the build may only read the repository; only the publishing job below may write to the release page)
permissions:
  contents: read

env:
  ORT_VERSION: "1.19.2"
  CT2_VERSION: "4.5.0"
  MODELS_RELEASE: "v1.6"

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [light, full]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: ONNX Runtime for Windows
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/microsoft/onnxruntime/releases/download/v$env:ORT_VERSION/onnxruntime-win-x64-$env:ORT_VERSION.zip" -OutFile ort.zip
          # (the file must be the size Microsoft published for this version: 64,540,734 bytes; GitHub gives no checksum for it)
          if ((Get-Item ort.zip).Length -ne 64540734) { throw "onnxruntime zip: unexpected size $((Get-Item ort.zip).Length)" }
          Expand-Archive ort.zip -DestinationPath ort

      - name: Models (from the Android download of the release)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $apk = if ("${{ matrix.edition }}" -eq "full") { "KhanaReader-Android.apk" } else { "KhanaReader-Android-lite.apk" }
          gh release download $env:MODELS_RELEASE --repo $env:GITHUB_REPOSITORY -p $apk -D apk
          Move-Item "apk/$apk" apk/models.zip
          Expand-Archive apk/models.zip -DestinationPath apk/x
          New-Item -ItemType Directory -Force pack/models | Out-Null
          foreach ($d in "parsigo", "ocr") { Copy-Item "apk/x/assets/app/models/$d" "pack/models/$d" -Recurse }
          Copy-Item "apk/x/assets/app/models/cmudict.dict" "pack/models/"
          Copy-Item "apk/x/assets/app/models/LICENSE" "pack/models/" -ErrorAction SilentlyContinue
          if ("${{ matrix.edition }}" -eq "full") {
            New-Item -ItemType Directory -Force pack/models/translate | Out-Null
            Copy-Item "apk/x/assets/app/models/translate/nllb-200-600M" "pack/models/translate/nllb-200-600M" -Recurse
          }
          Remove-Item apk -Recurse -Force
          Get-ChildItem pack/models | Select-Object Name

      - name: CTranslate2 (cache)
        if: matrix.edition == 'full'
        id: ct2cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ct2build
          key: ct2-${{ env.CT2_VERSION }}-ruy-1

      - name: CTranslate2 for Windows
        if: matrix.edition == 'full' && steps.ct2cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone --depth 1 --branch v$env:CT2_VERSION --recurse-submodules --shallow-submodules https://github.com/OpenNMT/CTranslate2.git ct2src
          # (the tag must still be the commit it was when this was written: a tag can be moved, a commit cannot)
          if ((git -C ct2src rev-parse HEAD) -ne "383d063daf0bf338a22b491864cb2018eb8efd15") { throw "CTranslate2: the v$env:CT2_VERSION tag is not the expected commit" }
          cmake -S ct2src -B ct2build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DWITH_MKL=OFF -DWITH_RUY=ON -DOPENMP_RUNTIME=COMP -DBUILD_CLI=OFF -DBUILD_TESTS=OFF "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
          cmake --build ct2build --config Release --parallel 4
          Get-ChildItem -Recurse ct2build -Include ctranslate2.dll, ctranslate2.lib | Select-Object FullName

      - name: Build
        shell: pwsh
        run: |
          if ("${{ matrix.edition }}" -eq "full") { $env:KHANA_CT2_DIR = "${{ github.workspace }}\ct2build\Release" }
          cargo build --release --bin khana --example ci_check

      - name: Check of the core (voice, text, WAV, picture, translation)
        shell: pwsh
        env:
          KHANA_MODELS: ${{ github.workspace }}/pack/models
        run: |
          $dll = (Get-ChildItem -Recurse ort -Filter onnxruntime.dll | Select-Object -First 1).FullName
          Copy-Item $dll target/release/examples/
          if ("${{ matrix.edition }}" -eq "full") {
            Copy-Item ct2build/Release/ctranslate2.dll target/release/examples/
            $env:KHANA_EXPECT_TRANSLATE = "1"
          }
          .\target\release\examples\ci_check.exe
          if ($LASTEXITCODE -ne 0) { throw "the check failed" }

      - name: Package
        shell: pwsh
        run: |
          $out = "KhanaReader-Windows"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item target/release/khana.exe "$out/KhanaReader.exe"
          Get-ChildItem -Recurse ort -Filter onnxruntime*.dll | ForEach-Object { Copy-Item $_.FullName $out }
          if ("${{ matrix.edition }}" -eq "full") { Copy-Item ct2build/Release/ctranslate2.dll $out }
          # (Microsoft's runtime libraries, so that a PC without them can still run the program)
          foreach ($n in "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll", "vcomp140.dll") { if (Test-Path "C:\Windows\System32\$n") { Copy-Item "C:\Windows\System32\$n" $out } }
          Copy-Item web "$out/web" -Recurse
          Copy-Item pack/models "$out/models" -Recurse
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md $out
          Copy-Item windows/README-Windows.txt $out
          $zip = "KhanaReader-Windows-${{ matrix.edition }}-experimental.zip"
          Compress-Archive -Path $out -DestinationPath $zip -CompressionLevel Optimal
          Get-Item $zip | Select-Object Name, Length

      - name: Window smoke test (does the window open and load the page?)
        continue-on-error: true
        shell: pwsh
        run: |
          $dl = "$env:USERPROFILE\Downloads"
          New-Item -ItemType Directory -Force $dl | Out-Null
          Set-Content "$dl\selftest.txt" "x"
          $env:KHANA_SELFTEST = "selftest.txt"
          $p = Start-Process -FilePath ".\KhanaReader-Windows\KhanaReader.exe" -PassThru -RedirectStandardError err.txt -RedirectStandardOutput out.txt
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep 2
            if ((Test-Path err.txt) -and (Select-String -Path err.txt -Pattern "SELFTEST loaded" -Quiet)) { $ok = $true; break }
          }
          Get-Content err.txt -ErrorAction SilentlyContinue | Select-Object -First 8
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "the window did not load the page" }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: KhanaReader-Windows-${{ matrix.edition }}-experimental
          path: KhanaReader-Windows-${{ matrix.edition }}-experimental.zip
          retention-days: 14
          compression-level: 0

  release:
    needs: build
    if: ${{ inputs.release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: zips
          merge-multiple: true
      - name: Add the packages to the release page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v1.6"
          ls -la zips
          gh release upload "$tag" zips/*.zip --clobber
