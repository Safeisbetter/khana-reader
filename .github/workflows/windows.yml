        if: matrix.edition == 'full'
        with:
          name: Windows-full-transfer-1
          path: windows-full-part-1.bin
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.edition == 'full'
        with:
          name: Windows-full-transfer-2
          path: windows-full-part-2.bin
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: KhanaReader-Windows-${{ matrix.edition }}-experimental
          path: KhanaReader-Windows-${{ matrix.edition }}-experimental.zip
          retention-days: 14
          compression-level: 0
  release:
    needs: build
    if: ${{ inputs.release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: zips
          merge-multiple: true
      - name: Add the packages to the release page
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then echo "Set the 'tag' input to an existing release tag."; exit 1; fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then echo "No release named $TAG. Create it first; this step does not create releases."; exit 1; fi
          ls -la zips
          gh release upload "$TAG" zips/*.zip --clobber
