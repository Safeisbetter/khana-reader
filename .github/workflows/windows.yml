# The Windows app (experimental, not tried on a real PC). Built on GitHub's own Windows computers, in two editions:
#   lite: no translator (about 0.5 GB); full: with the translator (CTranslate2, built here, and the 600M translation model; about 1.1 GB).
# Both hold the program, ONNX Runtime 1.19.2 (Microsoft's published build) beside it, the page (web/) and the models (taken from the Android
# downloads of the release, which hold the same files). A check of the core and of the window runs before a package is made.
# Run by hand (Actions -> Windows -> Run workflow) or on a push to the branch windows-full.
name: Windows

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Also upload the packages to the release named in 'tag' (the release must already exist)"
        type: boolean
        default: false
      tag:
        description: "Existing draft release tag to upload the Windows packages to, for example v1.33-beta1"
        type: string
        required: false
        default: ""
  push:
    branches: [windows-full, release-review-1.21, release-review-1.22]

# (the build may only read the repository; only the publishing job below may write to the release page)
permissions:
  contents: read

env:
  ORT_VERSION: "1.19.2"
  CT2_VERSION: "4.5.0"
  MODELS_RELEASE: v1.33-beta1

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [full, lite]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ONNX Runtime for Windows
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Microsoft's onnxruntime page on GitHub is gone (2026-11-18), so the DLL is taken from Khana's own
          # v1.30 Windows package, which carries onnxruntime.dll from the size-checked Microsoft 1.19.2 zip.
          gh release download v1.30 --repo $env:GITHUB_REPOSITORY -p KhanaReader-Windows-full-experimental.zip -D ortpkg
          if ($LASTEXITCODE -ne 0) { throw "ONNX Runtime package download failed" }
          if ((Get-FileHash ortpkg/KhanaReader-Windows-full-experimental.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne "6df163a220814887a2a5c30e4e0405cad851c6e3dab2cc7c50a15f86b3cf1acd") { throw "ONNX Runtime package checksum mismatch" }
          Expand-Archive ortpkg/KhanaReader-Windows-full-experimental.zip -DestinationPath ortpkg/x
          New-Item -ItemType Directory -Force ort | Out-Null
          $dll = Get-ChildItem -Recurse ortpkg/x -Filter onnxruntime*.dll
          if (-not $dll) { throw "onnxruntime.dll not found in the v1.30 package" }
          $dll | ForEach-Object { Copy-Item $_.FullName ort/ }
          Remove-Item -Recurse -Force ortpkg

      - name: Models (from the Android download of the release)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $apk = if ("${{ matrix.edition }}" -eq "full") { "KhanaReader.apk" } else { "KhanaReader-lite.apk" }
          $releasesJson = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) { throw "Could not list releases" }
          $release = $releasesJson | ConvertFrom-Json | Where-Object { $_.tag_name -eq $env:MODELS_RELEASE } | Select-Object -First 1
          if (-not $release) { throw "Draft model release not found by tag in the authenticated release list" }
          $assetsJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/$($release.id)/assets?per_page=100"
          if ($LASTEXITCODE -ne 0) { throw "Could not list Android model assets" }
          $asset = $assetsJson | ConvertFrom-Json | Where-Object { $_.name -eq $apk } | Select-Object -First 1
          if (-not $asset) { throw "Android model package not found in draft release" }
          New-Item -ItemType Directory -Force apk | Out-Null
          curl.exe --fail --silent --show-error --location -H "Accept: application/octet-stream" -H "Authorization: Bearer $env:GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/assets/$($asset.id)" --output "apk/$apk"
          if ($LASTEXITCODE -ne 0) { throw "Model package download failed" }
          $expected = if ("${{ matrix.edition }}" -eq "full") { "6abe49408041707c3be8ec0230315a8cd9fc4fbceda2f0bd100ca01354e24c65" } else { "d00111e35db05cd5c361c3863d13d4c6e24fdf37dc50d238026790d9141d1ddf" }
          if ((Get-FileHash "apk/$apk" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw "Model package checksum mismatch" }
          Move-Item "apk/$apk" apk/models.zip
          Expand-Archive apk/models.zip -DestinationPath apk/x
          New-Item -ItemType Directory -Force pack/models | Out-Null
          foreach ($d in "parsigo", "ocr") { Copy-Item "apk/x/assets/app/models/$d" "pack/models/$d" -Recurse }
          Copy-Item "apk/x/assets/app/models/cmudict.dict" "pack/models/"
          Copy-Item "apk/x/assets/app/models/LICENSE" "pack/models/" -ErrorAction SilentlyContinue
          if ("${{ matrix.edition }}" -eq "full") {
            New-Item -ItemType Directory -Force pack/models/translate | Out-Null
            Copy-Item "apk/x/assets/app/models/translate/nllb-200-600M" "pack/models/translate/nllb-200-600M" -Recurse
          }
          Remove-Item apk -Recurse -Force
          Get-ChildItem pack/models | Select-Object Name

      - name: CTranslate2 (cache)
        if: matrix.edition == 'full'
        id: ct2cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ct2build
          key: ct2-${{ env.CT2_VERSION }}-ruy-1

      - name: CTranslate2 for Windows
        if: matrix.edition == 'full' && steps.ct2cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone --depth 1 --branch v$env:CT2_VERSION --recurse-submodules --shallow-submodules https://github.com/OpenNMT/CTranslate2.git ct2src
          # (the tag must still be the commit it was when this was written: a tag can be moved, a commit cannot)
          if ((git -C ct2src rev-parse HEAD) -ne "383d063daf0bf338a22b491864cb2018eb8efd15") { throw "CTranslate2: the v$env:CT2_VERSION tag is not the expected commit" }
          cmake -S ct2src -B ct2build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DWITH_MKL=OFF -DWITH_RUY=ON -DOPENMP_RUNTIME=COMP -DBUILD_CLI=OFF -DBUILD_TESTS=OFF "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
          cmake --build ct2build --config Release --parallel 4
          Get-ChildItem -Recurse ct2build -Include ctranslate2.dll, ctranslate2.lib | Select-Object FullName

      - name: Build
        shell: pwsh
        run: |
          if ("${{ matrix.edition }}" -eq "full") { $env:KHANA_CT2_DIR = "${{ github.workspace }}\ct2build\Release" }
          cargo build --release --bin khana

      - name: Package
        shell: pwsh
        run: |
          $out = "KhanaReader-Windows"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item target/release/khana.exe "$out/KhanaReader.exe"
          Get-ChildItem -Recurse ort -Filter onnxruntime*.dll | ForEach-Object { Copy-Item $_.FullName $out }
          if ("${{ matrix.edition }}" -eq "full") { Copy-Item ct2build/Release/ctranslate2.dll $out }
          # (Microsoft's runtime libraries, so that a PC without them can still run the program)
          foreach ($n in "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll", "vcomp140.dll") { if (Test-Path "C:\Windows\System32\$n") { Copy-Item "C:\Windows\System32\$n" $out } }
          Copy-Item web "$out/web" -Recurse
          Copy-Item pack/models "$out/models" -Recurse
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md $out
          Copy-Item windows/README-Windows.txt $out
          $zip = "KhanaReader-Windows-${{ matrix.edition }}-experimental.zip"
          Compress-Archive -Path $out -DestinationPath $zip -CompressionLevel Optimal
          Get-Item $zip | Select-Object Name, Length

      - name: Window smoke test (does the window open and load the page?)
        shell: pwsh
        run: |
          $dl = "$env:USERPROFILE\Downloads"
          New-Item -ItemType Directory -Force $dl | Out-Null
          $env:KHANA_SMOKE = "1"
          $p = Start-Process -FilePath ".\KhanaReader-Windows\KhanaReader.exe" -PassThru -RedirectStandardError err.txt -RedirectStandardOutput out.txt
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep 2
            if ((Test-Path err.txt) -and (Select-String -Path err.txt -Pattern "SMOKE page loaded 200" -Quiet)) { $ok = $true; break }
          }
          Get-Content err.txt -ErrorAction SilentlyContinue | Select-Object -First 8
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "the window did not load the page" }

      - name: Split full package for size-limited artifact transfers
        if: matrix.edition == 'full'
        shell: pwsh
        run: |
          $inputStream = [System.IO.File]::OpenRead('KhanaReader-Windows-full-experimental.zip')
          try {
            $buffer = New-Object byte[] (1024 * 1024)
            $part = 0
            while ($inputStream.Position -lt $inputStream.Length) {
              $part++
              $outputStream = [System.IO.File]::Create("windows-full-part-$part.bin")
              try {
                $remaining = 480L * 1024 * 1024
                while ($remaining -gt 0) {
                  $count = $inputStream.Read($buffer, 0, [int][Math]::Min($remaining, $buffer.Length))
                  if ($count -eq 0) { break }
                  $outputStream.Write($buffer, 0, $count)
                  $remaining -= $count
                }
              } finally { $outputStream.Dispose() }
            }
            if ($part -ne 2) { throw 'Unexpected transfer part count' }
          } finally { $inputStream.Dispose() }
          Get-FileHash KhanaReader-Windows-full-experimental.zip -Algorithm SHA256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.edition == 'full'
        with:
          name: Windows-full-transfer-1
          path: windows-full-part-1.bin
          compression-level: 0
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.edition == 'full'
        with:
          name: Windows-full-transfer-2
          path: windows-full-part-2.bin
          compression-level: 0
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: KhanaReader-Windows-${{ matrix.edition }}-experimental
          path: KhanaReader-Windows-${{ matrix.edition }}-experimental.zip
          retention-days: 14
          compression-level: 0

  release:
    needs: build
    if: ${{ inputs.release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: zips
          merge-multiple: true
      - name: Add the packages to the release page
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then echo "Set the 'tag' input to an existing release tag."; exit 1; fi
          releases=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100")
          release_id=$(printf '%s' "$releases" | jq -r --arg tag "$TAG" '.[] | select(.tag_name == $tag) | .id' | head -n 1)
          if [ -z "$release_id" ]; then echo "Draft release not found by tag in the authenticated release list."; exit 1; fi

          # Keep a supplemental checksum file for the Windows packages; leave existing draft assets untouched.
          (cd zips && sha256sum *.zip) > SHA256SUMS-Windows-1.33-beta1.txt
          ls -la zips
          for file in zips/*.zip SHA256SUMS-Windows-1.33-beta1.txt; do
            asset_name="$(basename "$file")"
            expected="$(sha256sum "$file" | cut -d ' ' -f 1)"
            export ASSET_NAME="$asset_name"
            existing="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" --jq '.[] | select(.name == env.ASSET_NAME) | [.id, (.digest // "")] | @tsv' | head -n 1)"
            if [ -n "$existing" ]; then
              existing_digest="${existing#*
\t'}"
              existing_digest="${existing_digest#sha256:}"
              if [ "$existing_digest" = "$expected" ]; then
                echo "Already present with matching digest: $asset_name"
                continue
              fi
              echo "Draft already has $asset_name with a different digest; refusing to replace it." >&2
              exit 1
            fi
            curl --fail --silent --show-error --location --request POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$file" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$asset_name" \
              --output upload-response.json
            uploaded_digest="$(jq -r '.digest // empty' upload-response.json | sed 's/^sha256://')"
            if [ "$uploaded_digest" != "$expected" ]; then
              echo "Uploaded digest mismatch for $asset_name." >&2
              exit 1
            fi
            echo "Uploaded and verified: $asset_name"
          done
