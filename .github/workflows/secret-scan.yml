# Secret scan of the WHOLE history, on every push and pull request. No outside code: GitHub's own checkout (pinned) and
# the runner's Python. It fails when any commit, on any branch, ever held
#   - a key or token of a known kind (GitHub, Anthropic, OpenAI, AWS, Google, Slack, GitLab, npm, a private key block),
#   - a password written into a command or a setting (in a web address, in the password options of curl, sshpass,
#     mysql and signing tools, in a *_PASSWORD or *_TOKEN setting, in an Authorization header),
#   - an agent folder or memory file (.claude/, .cursor/, .gemini/, .specstory/, memory/, CLAUDE.md, settings.local.json...),
#     which hold secrets the way a .env file does,
#   - a signing key or credential file.
# Only WHERE is printed (commit, file, kind), never the value: this log is public.
name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan every commit
        shell: bash
        run: |
          git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*' 2>/dev/null || true
          python3 -I - <<'PY'
          import re, subprocess, sys
          KINDS = [
              ("GitHub token", r"\b(gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,})"),
              ("Anthropic key", r"\bsk-ant-[A-Za-z0-9_-]{20,}"),
              ("OpenAI-style key", r"\bsk-(?:proj-)?[A-Za-z0-9_-]{32,}"),
              ("AWS key", r"\b(?:AKIA|ASIA)[0-9A-Z]{16}\b"),
              ("Google API key", r"\bAIza[0-9A-Za-z_-]{35}\b"),
              ("Slack token", r"\bxox[abposr]-[A-Za-z0-9-]{10,}"),
              ("GitLab token", r"\bglpat-[A-Za-z0-9_-]{20,}"),
              ("npm token", r"\bnpm_[A-Za-z0-9]{36}\b"),
              ("private key block", r"-----BEGIN (?:[A-Z]+ )?PRIVATE KEY-----"),
              ("password in a URL", r"\b[a-zA-Z][a-zA-Z0-9+.-]*://[^\s/:@$\"'<>]+:[^\s/@$\"'<>]{3,}@[A-Za-z0-9.-]+"),
              ("password in curl's user option", r"curl\b[^|;&\n]*\s(?:-u|--user)\s+[^\s:$\"']+:[^\s$\"']{3,}"),
              ("sshpass -p", r"\bsshpass\s+-p\s*[^\s$\"'-]\S*"),
              ("password flag", r"(?:--password|--passwd|--ks-pass|--key-pass)[= ]+[\"']?(?:pass:)?(?!file:|env:|stdin|\$)[^\s\"'<]{3,}"),
              ("password setting", r"\b[A-Z][A-Z0-9_]*(?:PASSWORD|PASSWD|_TOKEN|_SECRET|API_KEY)\s*[:=]\s*[\"']?[A-Za-z0-9+/=_.!@#%^&*~-]{8,}(?:[\"'\s]|$)"),
              ("Authorization header", r"Authorization:\s*(?:Bearer|Basic|token)\s+[A-Za-z0-9._~+/=-]{12,}"),
              ("mysql -p", r"\bmysql\b[^|;&\n]*\s-p[^$\s\"']{3,}"),
          ]
          RX = [(k, re.compile(p)) for k, p in KINDS]
          AGENT = re.compile(r"(^|/)\.(claude|cursor|gemini|specstory|aider[^/]*|continue|windsurf|codeium|copilot)(/|$)|(^|/)(CLAUDE|AGENTS|GEMINI|MEMORY)\.md$|(^|/)memory/|settings\.local\.json$")
          SECRET_FILE = re.compile(r"(?i)\.(jks|keystore|p12|pfx|pem|key|p8|mobileprovision)$|(^|/)\.env(\.|$)|(^|/)password[^/]*$|(^|/)id_(rsa|ed25519|ecdsa)$|(^|/)credentials?(\.json)?$")
          SELF = ".github/workflows/secret-scan.yml"
          found = []
          names = subprocess.run(["git", "log", "--all", "--name-only", "--format=commit %H"], capture_output=True, text=True).stdout
          commit = None
          for line in names.splitlines():
              if line.startswith("commit "):
                  commit = line[7:15]
              elif line:
                  if AGENT.search(line):
                      found.append((commit, line, "agent folder or memory file"))
                  elif SECRET_FILE.search(line):
                      found.append((commit, line, "key or credential file"))
          log = subprocess.Popen(["git", "log", "--all", "-p", "--no-color", "--no-ext-diff", "--format=commit %H"], stdout=subprocess.PIPE, text=True, errors="replace")
          commit = path = None
          for line in log.stdout:
              if line.startswith("commit ") and len(line) > 40:
                  commit = line[7:15]
              elif line.startswith("+++ "):
                  path = line[6:].strip() if line.startswith("+++ b/") else None
              elif line.startswith("+") and path and path != SELF:
                  for kind, rx in RX:
                      if rx.search(line):
                          found.append((commit, path, kind))
          log.wait()
          for c, p, k in sorted(set(found)):
              print(f"FOUND  commit {c}  {p}  ({k})")
          print(f"{len(set(found))} finding(s) in {subprocess.run(['git', 'rev-list', '--all', '--count'], capture_output=True, text=True).stdout.strip()} commits")
          sys.exit(1 if found else 0)
          PY
